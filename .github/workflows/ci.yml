name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin to a Flutter version that ships stable Dart 3.10. Flutter
          # 3.38.0 itself shipped with Dart 3.10.0-beta which doesn't satisfy
          # our pubspec constraint of `^3.10.0` (pre-release tags sort below
          # 3.10.0). 3.38.7 is the first patch with stable Dart 3.10.7.
          flutter-version: '3.38.7'
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run format-check
      - run: melos run analyze
      - run: melos run test

  # The bridge's Unity half ships as template C# and had no coverage at all,
  # which is where both wire-format bugs fixed on this branch lived.
  # FlunityJson.cs is deliberately free of UnityEngine references so it can be
  # compiled and tested here with no editor install. The rest of the Unity
  # scripts still need one — `melos run check-unity-scripts` type-checks those
  # locally against an installed editor.
  unity_csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test csharp/Flunity.Json.Tests --verbosity minimal
