name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin the exact version declared as our floor in
          # packages/flunity_bridge/pubspec.yaml, so CI proves the declared
          # minimum really builds. 3.44 is the floor because Swift Package
          # Manager support for plugins requires it. Unlike the old 3.38.0 pin,
          # 3.44.0 shipped stable Dart 3.12.0 (not a pre-release), so it
          # satisfies `sdk: ^3.12.0` directly.
          flutter-version: '3.44.0'
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run format-check
      - run: melos run analyze
      - run: melos run test

  # The bridge's Unity half ships as template C# and had no coverage at all,
  # which is where both wire-format bugs fixed on this branch lived.
  # FlunityJson.cs is deliberately free of UnityEngine references so it can be
  # compiled and tested here with no editor install. The rest of the Unity
  # scripts still need one — `melos run check-unity-scripts` type-checks those
  # locally against an installed editor.
  unity_csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test csharp/Flunity.Json.Tests --verbosity minimal
